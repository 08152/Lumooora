<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>JSON KI</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #chat { border: 1px solid #ccc; padding: 10px; min-height: 200px; }
    .msg { margin: 5px 0; }
    .user { font-weight: bold; color: #0077cc; }
    .bot { font-weight: bold; color: #cc0077; }
  </style>
</head>
<body>
  <h1>JSON KI</h1>

  <div id="chat"></div>

  <form id="chat-form">
    <input id="user-input" type="text" placeholder="Frage mich etwas..." style="width: 80%;" required />
    <button type="submit">Senden</button>
  </form>

  <script src="model.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = (who === 'user' ? 'Du: ' : 'KI: ') + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const reply = generateReply(text);
      addMessage(reply, 'bot');
    });
  </script>
</body>
</html>
